the below code in this file is changed from Karl Zylinski's odin-raylib-web template:
1. additional CSS styling
2. additional net.js script
3. additional input.js script
4. added input install
5. send-resize hack
-->
<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

	<title>FlickOff</title>
	<meta name="title" content="FlickOff">
	<meta name="description" content="Aim trainer">
	<meta name="viewport" content="width=device-width">

	<style>
		body { 
			margin: 0px;
			overflow: hidden;
			background-color: black;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		canvas.game_canvas { 
			border: 5px none;
		    background-color: black;
		    padding-left: 10;
		    padding-right: 10;
		    margin-left: 10;
		    margin-right: 10;
		    display: block;
		    width: 90vw;
		    height: 85vh;
		}
	</style>
</head>
<body>
	<canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>
	<script type="text/javascript" src="odin.js"></script>
	<script type="text/javascript" src="net.js"></script>
	<script type="text/javascript" src="input.js"></script>
	<script>
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		// The Module is used as configuration for emscripten.
		var Module = {
			// This is called by emscripten when it starts up.
			instantiateWasm: (imports, successCallback) => {
				// Merge the net bridge functions into Emscripten's env so
				// Odin's `foreign {}` imports resolve at link time.
				Object.assign(imports.env, netBridge);
				
				const newImports = {
					...odinImports,
					...imports
				}

				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			// This happens a bit after `instantiateWasm`, when everything is
			// done setting up. At that point we can run code.
			onRuntimeInitialized: () => {
				var e = wasmExports;

				// Calls any procedure marked with @init
				e._start();

				// See source/main_web/main_web.odin for main_start,
				// main_update and main_end.
				e.main_start();

				// Allow input capture listeners
				inputBridge.install();

				function send_resize() {
					var canvas = document.getElementById('canvas');
					canvas.width = window.innerWidth;
    				canvas.height = window.innerHeight;
					e.web_window_size_changed(canvas.width, canvas.height);
				}

				window.addEventListener('resize', function(event) {
					send_resize();
				}, true);

				// This can probably be done better: Ideally we'd feed the
				// initial size to `main_start`. But there seems to be a
				// race condition. `canvas` doesn't have it's correct size yet.
				send_resize();

				// Runs the "main loop".
				function do_main_update() {
					if (!e.main_update()) {
						e.main_end();

						// Calls procedures marked with @fini
						e._end();
						return;
					}
					window.requestAnimationFrame(do_main_update);
				}

				window.requestAnimationFrame(do_main_update);
			},
			print: (function() {
				var element = document.getElementById("output");
				if (element) element.value = ''; // clear browser cache
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
					if (element) {
					  element.value += text + "\n";
					  element.scrollTop = element.scrollHeight; // focus on bottom
					}
				};
			})(),
			canvas: (function() {
				return document.getElementById("canvas");
			})()
		};
	</script>

	<!-- Emscripten injects its javascript here -->
	{{{ SCRIPT }}}
</body>
</html>
